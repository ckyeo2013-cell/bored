<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BANANA REACTOR ULTRA</title>

<style>

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #89e189, #4f9e4f);
  color: white;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* BACKGROUND PARTICLES */
.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(0px);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  to {
    transform: translateY(-120vh);
    opacity: 0;
  }
}

/* UI */
#ui {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 20px;

  background: rgba(0,0,0,0.25);
  padding: 10px 18px;
  border-radius: 14px;

  z-index: 999;

  backdrop-filter: blur(4px);
}

.gorillaBoss {
  background: linear-gradient(145deg, #111111, #444444) !important;
  box-shadow: 0 0 30px rgba(255,0,0,0.45) !important;
}

#crosshair {
  font-size: 28px;
  display: flex;
  justify-content: center;
  align-items: center;

  position: fixed;
  width: 28px;
  height: 28px;
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 50%;
  pointer-events: none;
  z-index: 999999;
  transform: translate(-50%, -50%);
}

#subtitle {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);

  background: rgba(0,0,0,0.3);

  padding: 8px 14px;

  border-radius: 12px;

  font-size: 15px;

  z-index: 999;

  pointer-events: none;
}

/* PLAYER */
#player {
  width: 75px;
  height: 75px;

  position: absolute;

  border-radius: 18px;

  background: linear-gradient(145deg, #ffe16b, #ffc400);

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 42px;

  box-shadow:
    0 0 20px rgba(0,0,0,0.35),
    inset 0 0 12px rgba(255,255,255,0.3);

  transition: transform 0.08s linear;
}

.playerDash {
  animation: dash 0.2s ease;
}

@keyframes dash {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.15);
  }

  100% {
    transform: scale(1);
  }
}

/* ENEMIES */
.enemy {
  width: 65px;
  height: 65px;

  position: absolute;

  border-radius: 16px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 34px;

  background: linear-gradient(145deg, crimson, #8f0000);

  box-shadow: 0 0 15px rgba(0,0,0,0.3);

  animation: enemySpawn 0.25s ease;
}

.fastEnemy {
  background: linear-gradient(145deg, #00d5ff, #005f73);
}

.tankEnemy {
  background: linear-gradient(145deg, #6c5ce7, #3f2b96);
}

@keyframes enemySpawn {
  from {
    opacity: 0;
    transform: scale(0.6);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* BANANAS */
.banana {
  width: 45px;
  height: 45px;

  position: absolute;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 32px;

  animation: spin 0.45s linear infinite;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

/* EXPLOSION */
.explosion {
  position: absolute;

  width: 20px;
  height: 20px;

  border-radius: 50%;

  background: rgba(255,255,255,0.8);

  animation: boom 0.4s ease forwards;
}

@keyframes boom {
  from {
    transform: scale(0.5);
    opacity: 1;
  }

  to {
    transform: scale(8);
    opacity: 0;
  }
}

/* POWERUP */
.powerup {
  width: 60px;
  height: 60px;

  position: absolute;

  border-radius: 14px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 30px;

  background: linear-gradient(145deg, #ffffff, #cfcfcf);

  animation: floaty 1s ease-in-out infinite alternate;
}

@keyframes floaty {
  from {
    transform: translateY(0px);
  }

  to {
    transform: translateY(-10px);
  }
}

/* GAME OVER */
#gameOver {
  position: fixed;
  inset: 0;

  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;

  background: rgba(0,0,0,0.8);

  z-index: 99999;
}

#gameOver button {
  margin-top: 20px;

  padding: 12px 22px;

  border: none;
  border-radius: 12px;

  background: #69d769;

  color: white;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
}

/* MOBILE */
@media (max-width: 700px) {

  #player {
    width: 60px;
    height: 60px;
    font-size: 34px;
  }

  .enemy {
    width: 50px;
    height: 50px;
    font-size: 26px;
  }

  .banana {
    font-size: 24px;
  }

  #ui {
    font-size: 14px;
  }
}

</style>
</head>
<body>

<div id="game">

  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>HP: <span id="hp">3</span></div>
    <div>Wave: <span id="wave">1</span></div>
  </div>

  <div id="subtitle">WASD to move • SPACE to launch bananas • SHIFT to dash</div>

  <div id="player">🗿</div>

  <div id="crosshair">🍌</div>

  <div id="gameOver">
    <h1>You became potassium 💀</h1>
    <button onclick="location.reload()">Restart</button>
  </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const hpEl = document.getElementById("hp");
const waveEl = document.getElementById("wave");
const subtitle = document.getElementById("subtitle");
const gameOverScreen = document.getElementById("gameOver");
const crosshair = document.getElementById("crosshair");

window.addEventListener("mousemove", e => {
  crosshair.style.left = e.clientX + "px";
  crosshair.style.top = e.clientY + "px";
});

let score = 0;
let hp = 3;
let wave = 1;

let gameOver = false;

let playerX = 120;
let playerY = window.innerHeight - 180;

const enemies = [];
const bananas = [];
const powerups = [];

const keys = {};

let bananaCooldown = false;
let dashCooldown = false;

//////////////////////////////
// SUBTITLE SYSTEM
//////////////////////////////

function say(text) {
  subtitle.innerText = text;
}

//////////////////////////////
// INPUT
//////////////////////////////

document.addEventListener("keydown", e => {

  e.preventDefault();

  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    shootBanana();
  }

  if (e.key === "Shift") {
    dash();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

//////////////////////////////
// PLAYER
//////////////////////////////

function updatePlayer() {

  let speed = 5;

  if (keys["w"]) playerY -= speed;
  if (keys["s"]) playerY += speed;
  if (keys["a"]) playerX -= speed;
  if (keys["d"]) playerX += speed;

  playerX = Math.max(0, Math.min(window.innerWidth - 75, playerX));
  playerY = Math.max(0, Math.min(window.innerHeight - 75, playerY));

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";
}

function dash() {

  if (dashCooldown || gameOver) return;

  dashCooldown = true;

  player.classList.add("playerDash");

  playerX += 100;

  setTimeout(() => {
    player.classList.remove("playerDash");
  }, 200);

  say("🗿 DASHED LIKE A MANIAC");

  setTimeout(() => {
    dashCooldown = false;
  }, 1500);
}

//////////////////////////////
// BANANAS
//////////////////////////////

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

window.addEventListener("mousemove", e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener("touchmove", e => {
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
});

function shootBanana() {

  if ((bananaCooldown && !laserMode) || gameOver) return;

  const b = document.createElement("div");

  b.className = "banana";
  b.innerText = laserMode ? "⚡🍌" : "🍌";

  game.appendChild(b);

  const startX = playerX + 35;
  const startY = playerY + 20;

  const dx = mouseX - startX;
  const dy = mouseY - startY;

  const dist = Math.hypot(dx, dy);

  const speed = laserMode ? 18 : 10;

  bananas.push({
    el: b,
    x: startX,
    y: startY,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    laser: laserMode
  });

  if (!laserMode) {
    bananaCooldown = true;

    setTimeout(() => {
      bananaCooldown = false;
    }, 150);
  }
}

function updateBananas() {

  // AUTO FIRE DURING LASER MODE
  if (laserMode && Math.random() < 0.35) {
    shootBanana();
  }

  bananas.forEach((banana, i) => {

    banana.x += banana.vx;
    banana.y += banana.vy;

    banana.el.style.left = banana.x + "px";
    banana.el.style.top = banana.y + "px";

    if (
      banana.x < -100 ||
      banana.x > window.innerWidth + 100 ||
      banana.y < -100 ||
      banana.y > window.innerHeight + 100
    ) {

      banana.el.remove();
      bananas.splice(i, 1);
    }
  });
}

//////////////////////////////
// ENEMIES
//////////////////////////////

function spawnEnemy() {

  if (gameOver) return;

  const e = document.createElement("div");

  e.className = "enemy";

  const types = [
    { emoji: "😡", speed: 2, hp: 1 },
    { emoji: "🤖", speed: 3.5, hp: 1, class: "fastEnemy" },
    { emoji: "👹", speed: 1.4, hp: 3, class: "tankEnemy" },
    { emoji: "🦍", speed: 4.5, hp: 8, class: "gorillaBoss", gorilla: true }
  ];

  const type = types[Math.floor(Math.random() * types.length)];

  e.innerText = type.emoji;

  if (type.class) e.classList.add(type.class);

  game.appendChild(e);

  enemies.push({
    el: e,
    x: Math.random() * (window.innerWidth - 70),
    y: -70,
    speed: type.speed + wave * 0.08,
    hp: type.hp,
    gorilla: type.gorilla || false
  });
}

setInterval(() => {

  spawnEnemy();

  if (Math.random() < 0.15) {
    spawnPowerup();
  }

}, 850);

function updateEnemies() {

  enemies.forEach((enemy, ei) => {

    if (enemy.gorilla) {

      const dx = playerX - enemy.x;
      const dy = playerY - enemy.y;

      const dist = Math.hypot(dx, dy);

      enemy.x += (dx / dist) * enemy.speed;
      enemy.y += (dy / dist) * enemy.speed;

      enemy.el.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;

    } else {
      enemy.y += enemy.speed;
    }

    enemy.el.style.left = enemy.x + "px";
    enemy.el.style.top = enemy.y + "px";

    // PLAYER HIT
    if (
      enemy.x < playerX + 60 &&
      enemy.x + 60 > playerX &&
      enemy.y < playerY + 60 &&
      enemy.y + 60 > playerY
    ) {

      enemy.el.remove();
      enemies.splice(ei, 1);

      takeDamage();
    }

    // BANANA HIT
    bananas.forEach((banana, bi) => {

      if (
        banana.x < enemy.x + 50 &&
        banana.x + 30 > enemy.x &&
        banana.y < enemy.y + 50 &&
        banana.y + 30 > enemy.y
      ) {

        enemy.hp -= banana.laser ? 3 : 1;

        banana.el.remove();
        bananas.splice(bi, 1);

        createExplosion(enemy.x, enemy.y);

        if (enemy.hp <= 0) {

          flashScreen("rgba(255,255,0,0.4)");

          if (enemy.gorilla) {
            say("🦍 GORILLA BOY GOT ABSOLUTELY VAPORIZED");

            // REMOVE BODY INSTANTLY TO PREVENT WALLS
            enemy.el.style.pointerEvents = "none";
            enemy.el.style.opacity = "0";

            // CHAOS SPLIT BANANAS
            for (let s = 0; s < 6; s++) {

              const split = document.createElement("div");
              split.className = "banana";
              split.innerText = "🍌";

              game.appendChild(split);

              const angle = (Math.PI * 2 / 6) * s;

              bananas.push({
                el: split,
                x: enemy.x,
                y: enemy.y,
                vx: Math.cos(angle) * 8,
                vy: Math.sin(angle) * 8,
                laser: true
              });
            }
          }

          enemy.el.remove();
          enemies.splice(ei, 1);

          score += enemy.gorilla ? 10 : 1;

          if (score % 10 === 0) {
            wave++;
            waveEl.innerText = wave;
            say("⚠️ WAVE " + wave + " HAS ARRIVED");
          }

          scoreEl.innerText = score;
        }
      }
    });
  });
}

//////////////////////////////
// POWERUPS
//////////////////////////////

function spawnPowerup() {

  const p = document.createElement("div");

  p.className = "powerup";
  p.innerText = "💊";

  game.appendChild(p);

  powerups.push({
    el: p,
    x: Math.random() * (window.innerWidth - 60),
    y: Math.random() * (window.innerHeight - 300)
  });
}

function updatePowerups() {

  powerups.forEach((p, i) => {

    p.el.style.left = p.x + "px";
    p.el.style.top = p.y + "px";

    if (
      p.x < playerX + 60 &&
      p.x + 60 > playerX &&
      p.y < playerY + 60 &&
      p.y + 60 > playerY
    ) {

      hp++;
      hpEl.innerText = hp;

      say("💊 YOU ATE MYSTERY MEDICINE");

      p.el.remove();
      powerups.splice(i, 1);
    }
  });
}

//////////////////////////////
// DAMAGE
//////////////////////////////

function takeDamage() {

  hp--;

  hpEl.innerText = hp;

  say("💀 OW THAT PROBABLY HURT");

  game.style.transform = "translateX(8px)";

  setTimeout(() => {
    game.style.transform = "translateX(0px)";
  }, 80);

  if (hp <= 0) {
    die();
  }
}

//////////////////////////////
// EXPLOSIONS
//////////////////////////////

function createExplosion(x, y) {

  const ex = document.createElement("div");

  ex.className = "explosion";

  ex.style.left = x + "px";
  ex.style.top = y + "px";

  game.appendChild(ex);

  setTimeout(() => {
    ex.remove();
  }, 400);
}

//////////////////////////////
// PARTICLES
//////////////////////////////

function createParticles() {

  for (let i = 0; i < 30; i++) {

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.top = Math.random() * window.innerHeight + "px";

    p.style.animationDuration = 4 + Math.random() * 8 + "s";

    game.appendChild(p);
  }
}

createParticles();

//////////////////////////////
// GAME OVER
//////////////////////////////

function die() {

  gameOver = true;

  say("☠️ THE BANANAS HAVE WON");

  gameOverScreen.style.display = "flex";
}

//////////////////////////////
// BANANA STORM
//////////////////////////////

let stormCooldown = false;

function bananaStorm() {

  if (stormCooldown || gameOver) return;

  stormCooldown = true;

  say("🌪️ BANANA STORM ACTIVATED");

  for (let i = 0; i < 25; i++) {

    setTimeout(() => {

      const b = document.createElement("div");

      b.className = "banana";
      b.innerText = "🍌";

      game.appendChild(b);

      bananas.push({
        el: b,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight,
        speed: 8 + Math.random() * 5
      });

    }, i * 40);
  }

  setTimeout(() => {
    stormCooldown = false;
  }, 7000);
}

//////////////////////////////
// GOLDEN BANANA
//////////////////////////////

function spawnGoldenBanana() {

  const g = document.createElement("div");

  g.className = "powerup";
  g.innerText = "👑🍌";

  game.appendChild(g);

  const golden = {
    el: g,
    x: Math.random() * (window.innerWidth - 60),
    y: Math.random() * (window.innerHeight - 250)
  };

  powerups.push(golden);
}

setInterval(() => {

  if (Math.random() < 0.2 && !gameOver) {
    spawnGoldenBanana();
  }

}, 9000);

//////////////////////////////
// BANANA KING BOSS
//////////////////////////////

function spawnBoss() {

  say("👑 THE BANANA KING HAS ARRIVED");

  const boss = document.createElement("div");

  boss.className = "enemy tankEnemy";

  boss.style.width = "120px";
  boss.style.height = "120px";
  boss.style.fontSize = "60px";

  boss.innerText = "🦍";

  game.appendChild(boss);

  enemies.push({
    el: boss,
    x: window.innerWidth / 2 - 60,
    y: -120,
    speed: 1,
    hp: 25,
    boss: true
  });
}

//////////////////////////////
// MEME EVENTS
//////////////////////////////

const randomMessages = [
  "🍌 potassium overload detected",
  "🗿 the monkey council is watching",
  "💀 somebody slipped on a banana",
  "👹 enemies are evolving",
  "🤖 banana reactor stability: questionable"
];

setInterval(() => {

  if (!gameOver) {

    say(randomMessages[Math.floor(Math.random() * randomMessages.length)]);
  }

}, 12000);

//////////////////////////////
// LASER BANANA MODE
//////////////////////////////

let laserMode = false;

function activateLaserMode() {

  if (laserMode || gameOver) return;

  laserMode = true;

  say("🔫 LASER BANANA MODE ACTIVATED");

  player.style.boxShadow = "0 0 35px yellow";

  setTimeout(() => {

    laserMode = false;

    player.style.boxShadow = `
      0 0 20px rgba(0,0,0,0.35),
      inset 0 0 12px rgba(255,255,255,0.3)
    `;

    say("🍌 laser bananas depleted");

  }, 8000);
}

//////////////////////////////
// METEOR BANANA
//////////////////////////////

function spawnMeteorBanana() {

  const meteor = document.createElement("div");

  meteor.className = "banana";
  meteor.innerText = "☄️🍌";

  game.appendChild(meteor);

  let mx = Math.random() * window.innerWidth;
  let my = -100;

  const interval = setInterval(() => {

    if (gameOver) {
      clearInterval(interval);
      return;
    }

    my += 12;

    meteor.style.left = mx + "px";
    meteor.style.top = my + "px";

    enemies.forEach((enemy, ei) => {

      if (
        mx < enemy.x + 70 &&
        mx + 40 > enemy.x &&
        my < enemy.y + 70 &&
        my + 40 > enemy.y
      ) {

        createExplosion(enemy.x, enemy.y);

        enemy.el.remove();
        enemies.splice(ei, 1);

        score += 3;
        scoreEl.innerText = score;
      }
    });

    if (my > window.innerHeight + 100) {
      meteor.remove();
      clearInterval(interval);
    }

  }, 16);
}

setInterval(() => {

  if (Math.random() < 0.25 && !gameOver) {
    spawnMeteorBanana();
  }

}, 7000);

//////////////////////////////
// BLACK HOLE BANANA
//////////////////////////////

function spawnBlackHole(x, y) {

  const hole = document.createElement("div");

  hole.style.position = "absolute";
  hole.style.left = x + "px";
  hole.style.top = y + "px";

  hole.style.width = "120px";
  hole.style.height = "120px";

  hole.style.borderRadius = "50%";

  hole.style.background = "radial-gradient(circle, black 40%, purple 100%)";

  hole.style.boxShadow = "0 0 40px purple";

  hole.style.zIndex = "999";

  game.appendChild(hole);

  let life = 300;

  const suck = setInterval(() => {

    enemies.forEach((enemy, ei) => {

      const dx = x - enemy.x;
      const dy = y - enemy.y;

      const dist = Math.hypot(dx, dy);

      if (dist < 300) {

        enemy.x += dx / dist * 4;
        enemy.y += dy / dist * 4;
      }

      if (dist < 60) {

        createExplosion(enemy.x, enemy.y);

        enemy.el.remove();
        enemies.splice(ei, 1);

        score++;
        scoreEl.innerText = score;
      }
    });

    life--;

    if (life <= 0) {
      clearInterval(suck);
      hole.remove();
    }

  }, 16);
}

//////////////////////////////
// MONKEY RAIN
//////////////////////////////

function monkeyRain() {

  say("🐒 MONKEY RAIN HAS STARTED");

  for (let i = 0; i < 40; i++) {

    setTimeout(() => {

      const monkey = document.createElement("div");

      monkey.innerText = "🐒";

      monkey.style.position = "absolute";
      monkey.style.fontSize = "40px";

      monkey.style.left = Math.random() * window.innerWidth + "px";
      monkey.style.top = "-50px";

      game.appendChild(monkey);

      let my = -50;

      const fall = setInterval(() => {

        my += 12;

        monkey.style.top = my + "px";

        if (my > window.innerHeight + 100) {
          monkey.remove();
          clearInterval(fall);
        }

      }, 16);

    }, i * 100);
  }
}

//////////////////////////////
// SCREEN FLASHES
//////////////////////////////

function flashScreen(color) {

  const flash = document.createElement("div");

  flash.style.position = "fixed";
  flash.style.inset = "0";
  flash.style.background = color;
  flash.style.opacity = "0.35";
  flash.style.pointerEvents = "none";
  flash.style.zIn
